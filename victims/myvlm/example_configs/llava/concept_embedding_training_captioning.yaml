concept_name: oong #concept_name
concept_identifier: oong #sks            # For PERSON, this should be a short name such as Bob or Anna
concept_type: PERSON               # Can also be PERSON or OBJECT
vlm_type: LLAVA
personalization_task: CAPTIONING   # For LLaVA, we can do either CAPTIONING or VQA
output_root: ./outputs/oong_27apr_og_fr
data_root: /path/to/MyVLM/data_human
concept_head_path:  ./models    # Can be ignored if working with people
threshold: 0.675                         # For PERSON, this should be 0.675 or 0.5 for objects
optimization_steps: 200
learning_rate: 1.0
batch_size: 2
reg_lambda: 0.0075
save_interval: 25
val_interval: 25
seed: 42       # If concept is an object, this should be the same seed that was used for training the concept heads
device: cuda
torch_dtype: float32

# 423 normal llava, 423 attacked images, 42333 differewnt visual detector