concept_name: willinvietnam
concept_identifier: willinvietnam            # For PERSON, this should be a short name such as Bob or Anna
concept_type: PERSON               # Can also be PERSON or OBJECT
vlm_type: LLAVA
personalization_task: VQA   # For LLaVA, we can do either CAPTIONING or VQA
output_root: ./VQA_outputs/willinvietnam
data_root: /path/to/MyVLM/data_human
concept_head_path: ./object_concept_heads    # Can be ignored if working with people
threshold: 0.675                              # For PERSON, this should be 0.675
optimization_steps: 100
learning_rate: 1.0
batch_size: 2
reg_lambda: 10.0
save_interval: 25
val_interval: 25
seed: 42        # If concept is an object, this should be the same seed that was used for training the concept heads
device: cuda
torch_dtype: float32

# 423 normal llava, 423 attacked images, 42333 differewnt visual detector